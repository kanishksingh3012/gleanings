<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn Post Sync — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 360px;
        padding: 16px;
        color: #18181b;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-top: 12px;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d4d4d8;
        border-radius: 6px;
        font-size: 13px;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #18181b;
        color: white;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 16px;
      }
      #status.error {
        color: #dc2626;
      }
      #status.success {
        color: #16a34a;
      }
    </style>
  </head>
  <body>
    <h2 style="font-size: 15px; margin: 0">LinkedIn Post Sync</h2>

    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="text" placeholder="http://localhost:3000" />

    <label for="apiSecret">API Secret Key</label>
    <input id="apiSecret" type="password" placeholder="your API_SECRET_KEY" />

    <button id="save">Save</button>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
