<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gleanings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        width: 280px;
        margin: 0;
        padding: 16px;
        color: #18181b;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 { font-size: 15px; margin: 0; }
      p { font-size: 12.5px; color: #52525b; margin: 0; line-height: 1.5; }
      .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #d4d4d8; }
      .dot.ok { background: #16a34a; }
      .dot.bad { background: #dc2626; }
      button {
        height: 36px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
      }
      .primary { background: #2563eb; color: #fff; }
      .primary:hover { background: #1d4ed8; }
      .secondary { background: #f4f4f5; color: #18181b; }
      .secondary:hover { background: #e4e4e7; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>🌾 Gleanings</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Checking…</span></div>
    <p id="help">On LinkedIn, use the <strong>Gleanings</strong> box (bottom-right) or right-click a post → <em>Save post to Gleanings</em>.</p>
    <button class="primary" id="library" hidden>Open library</button>
    <button class="secondary" id="options">Settings</button>
    <script src="popup.js"></script>
  </body>
</html>
